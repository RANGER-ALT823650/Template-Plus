<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5ef"><title>Template Plus · 贴纸工作站</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/workstation.css"><link rel="stylesheet" href="/ui.css"><script type="module" src="/workstation.js"></script></head>
<body>
<header><a class="brand" href="/"><span class="brand-icon">✳</span><span>Template <b>Plus</b></span></a><nav><a class="current" href="/" data-i18n="贴纸">贴纸</a><a href="/avatar.html" data-i18n="形象">形象</a></nav><div class="header-actions"><button class="secondary icon-control" id="show-agent" data-help="使用命令行继续编辑布局" data-i18n-aria="使用命令行继续编辑布局">&gt;_</button><button class="language-toggle" id="language-toggle" type="button">EN</button></div></header>
<main>
  <div class="intro"><h1 data-i18n="贴纸工作站">贴纸工作站</h1><div class="intro-meta"><label><span data-i18n="机型">机型</span><select id="phone-model" data-i18n-aria="iPhone 机型"></select></label><button class="help" type="button" data-help-target="model-size" data-i18n-aria="平台尺寸">ⓘ</button><span id="model-name" hidden>iPhone Air</span><span id="model-size" hidden></span></div></div>
  <div class="workstation">
    <aside class="library card"><div class="section-title"><h2 data-i18n="形象">形象</h2><button class="help" type="button" data-help-target="recipe-hint" data-i18n-aria="形象说明">ⓘ</button></div><span id="recipe-hint" hidden></span><div id="shapes" class="shapes" data-i18n-aria="图案"></div><div id="colors" class="colors" data-i18n-aria="颜色"></div><button class="primary full" id="add-avatar" data-i18n="＋ 添加形象">＋ 添加形象</button><div class="pair import-actions"><button class="secondary" id="import-svg" data-i18n="↑ SVG">↑ SVG</button><button class="secondary" id="import-png" data-i18n="↑ 图片" data-help="图片支持 PNG、JPG、WebP、静态 GIF 和单页 TIFF，最大 5 MB。">↑ 图片</button></div><input id="png-file" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.tif,.tiff,image/png,image/jpeg,image/webp,image/gif,image/tiff" hidden><input id="svg-file" type="file" accept=".svg,image/svg+xml" hidden>
      <div class="divider"></div><div class="section-title"><h2 data-i18n="素材">素材</h2><small id="library-count"></small><button class="help" type="button" data-help-target="library-status" data-i18n-aria="素材说明">ⓘ</button></div><label class="library-filter"><select id="library-group" data-i18n-aria="素材系列"><option value="muse-png">Muse · PNG</option><option value="dots-svg">Dots · SVG</option><option value="muse-svg">Muse · SVG</option><option value="ai-logos-svg" data-i18n="AI 标志">AI 标志</option><option value="all" data-i18n="全部">全部</option></select></label><div id="asset-library" class="asset-library" data-i18n-aria="素材库"></div><span id="library-status" data-i18n="点击素材即可添加。" hidden>点击素材即可添加。</span>
      <div class="divider"></div><div class="section-title"><h2 data-i18n="示例">示例</h2><button class="help" type="button" data-help="载入示例会替换当前排版，可撤销。" data-i18n-aria="示例说明">ⓘ</button></div><div class="presets" id="presets"></div></aside>
    <section class="canvas-card card" data-i18n-aria="贴纸排版画布"><div class="canvas-top"><span class="live" data-i18n="画布">画布</span><div class="tools"><button id="undo" data-help="撤销 Ctrl / ⌘ Z" data-i18n-aria="撤销">↶</button><button id="redo" data-help="重做 Ctrl / ⌘ Shift Z" data-i18n-aria="重做">↷</button><span></span><button id="show-base" aria-pressed="true" data-i18n="底色">底色</button><button id="show-cut" aria-pressed="true" data-i18n="刀线">刀线</button><button class="help" type="button" data-help-target="geometry-note" data-i18n-aria="画布说明">ⓘ</button></div></div>
      <div class="canvas-area"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" tabindex="0"></svg><div class="canvas-caption"><span data-i18n="背面 · 镜头在左">背面 · 镜头在左</span><span id="object-count"></span></div></div>
      <div class="canvas-bottom"><button class="help" type="button" data-help="拖动移动 · 角点缩放 · 顶部圆点旋转。方向键移动 0.1 mm，Shift + 方向键移动 1 mm。" data-i18n-aria="操作说明">ⓘ</button><label><span data-i18n="缩放">缩放</span><select id="zoom" data-i18n-aria="画布缩放"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div><span id="geometry-note" hidden></span>
      <div class="layer-heading"><h2 data-i18n="图层">图层</h2><button class="help" type="button" data-help="上方图层显示在最前。" data-i18n-aria="图层说明">ⓘ</button></div><div id="layers" class="layers"></div><div class="layer-actions"><button id="duplicate" data-help="复制" data-i18n-aria="复制">⧉</button><button id="front" data-help="置顶" data-i18n-aria="置顶">⇡</button><button id="back" data-help="置底" data-i18n-aria="置底">⇣</button><button id="delete" class="danger" data-help="删除" data-i18n-aria="删除">×</button></div>
      <div class="mockup-section"><div class="mockup-heading"><h2 data-i18n="整机预览">整机预览</h2><button class="help" type="button" data-help="贴纸实时套用到机模。机模按官方尺寸绘制，色泽近似，不参与印刷导出。" data-i18n-aria="机模说明">ⓘ</button><label><select id="phone-color" data-i18n-aria="机身颜色"></select></label><a id="phone-specs" class="icon-control" href="https://www.apple.com.cn/iphone-air/specs/" target="_blank" rel="noreferrer" data-help="查看官方颜色与尺寸" data-i18n-aria="查看官方颜色与尺寸">↗</a><button class="secondary icon-control" id="toggle-mockup" aria-expanded="true">⌃</button></div><div id="mockup-panel"><svg id="phone-preview" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div></div>
    </section>
    <aside class="inspector card"><div class="section-title"><h2 data-i18n="调整">调整</h2><button class="help" type="button" data-help="坐标以平台左上角为原点，单位为毫米。" data-i18n-aria="坐标说明">ⓘ</button></div><div id="selection-empty" class="empty" hidden data-i18n="选择一个形象">选择一个形象</div><fieldset id="object-fields"><label><span data-i18n="名称">名称</span><input id="object-name" maxlength="100"></label><div class="pair"><label><span data-i18n="X / mm">X / mm</span><input id="pos-x" type="number" min="-100" max="165" step="0.1"></label><label><span data-i18n="Y / mm">Y / mm</span><input id="pos-y" type="number" min="-100" max="124" step="0.1"></label></div><div class="pair"><label><span data-i18n="宽 / mm">宽 / mm</span><input id="obj-width" type="number" min="0.5" max="150" step="0.1"></label><label><span data-i18n="旋转 / °">旋转 / °</span><input id="rotation" type="number" min="-360" max="360" step="1"></label></div><div class="size-info"><button class="help" type="button" data-help-target="height-label" data-i18n-aria="尺寸说明">ⓘ</button></div><span id="height-label" hidden></span><div class="pair"><button id="fill-plateau" class="secondary" data-i18n="铺满" data-help="保持宽高比例，覆盖整个平台并裁剪边界和孔位。">铺满</button><button id="center" class="secondary" data-i18n="居中">居中</button></div></fieldset>
      <div class="divider"></div><div class="section-title"><h2 data-i18n="导出">导出</h2><button class="help" type="button" data-help="PDF 含独立印刷层与 CutContour 专色刀线，四边留 2 mm，刀线打印默认关闭。请按 100% 实际尺寸输出，实裁前核对纸样。" data-i18n-aria="印刷说明">ⓘ</button></div><label><span data-i18n="设计名称">设计名称</span><input id="design-name" maxlength="80"></label><button class="primary full export-pdf" id="export-pdf" data-i18n="↓ 印切 PDF">↓ 印切 PDF</button><div class="pair"><button id="export-svg" class="secondary" data-i18n="↓ SVG">↓ SVG</button><button id="export-png" class="secondary" data-i18n="↓ PNG" data-help="透明图案，600 DPI，不含底色、刀线与机模。">↓ PNG</button></div><div class="divider"></div><div class="pair"><button id="save-layout" class="secondary" data-i18n="↓ 保存">↓ 保存</button><button id="load-layout" class="secondary" data-i18n="↑ 打开">↑ 打开</button></div><input id="layout-file" type="file" accept=".json,application/json" hidden><div class="save-row"><button id="clear" class="text" data-i18n="清空">清空</button><span id="save-status" class="save-status"></span></div></aside>
  </div>
</main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="agent-dialog" aria-labelledby="agent-title"><div class="agent-heading"><h2 id="agent-title" data-i18n="命令行">命令行</h2><button id="close-agent" class="text" data-i18n-aria="关闭">×</button></div><p data-i18n="下载布局，在 Template-Plus 目录运行命令；修改后打开 JSON 继续编辑。">下载布局，在 Template-Plus 目录运行命令；修改后打开 JSON 继续编辑。</p><button id="agent-save-layout" class="primary" data-i18n="↓ 下载布局">↓ 下载布局</button><pre id="agent-commands"></pre><button id="copy-agent-commands" class="secondary" data-i18n="复制命令">复制命令</button><p><a href="/STICKER-CLI.md" target="_blank" rel="noreferrer" data-i18n="使用说明 ↗">使用说明 ↗</a> · <a href="/sticker.schema.json" target="_blank" rel="noreferrer" data-i18n="布局契约 ↗">布局契约 ↗</a> · <a href="/sticker-operations.schema.json" target="_blank" rel="noreferrer" data-i18n="操作契约 ↗">操作契约 ↗</a></p></dialog>
</body></html>
