<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>MUSE · 气球</title>
  <defs>
    <radialGradient id="fur" gradientUnits="userSpaceOnUse" cx="-28.95" cy="-211.81" r="330">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="0.5" stop-color="#EFE5D5"/>
      <stop offset="1" stop-color="#DCCAB1"/>
    </radialGradient>
    <radialGradient id="faceFill" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6E7D6"/>
    </radialGradient>
    <filter id="plush" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="b"/>
      <feOffset in="b" dx="-8.31" dy="-13.45" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#A98A67" flood-opacity="0.62"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="b2"/>
      <feOffset in="b2" dx="1.57" dy="-29.96" result="bs2"/>
      <feComposite in="SourceAlpha" in2="bs2" operator="arithmetic" k2="1" k3="-1" result="am"/>
      <feFlood flood-color="#B89C7A" flood-opacity="0.35"/>
      <feComposite in2="am" operator="in" result="ambient"/>
      <feOffset in="b" dx="6.41" dy="11.35" result="bh"/>
      <feComposite in="SourceAlpha" in2="bh" operator="arithmetic" k2="1" k3="-1" result="hm"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.75"/>
      <feComposite in2="hm" operator="in" result="hl"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="ambient"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="hl"/>
      </feMerge>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="limb" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="1.63" dy="7.1" result="drop"/>
      <feFlood flood-color="#9C7C5B" flood-opacity="0.38"/>
      <feComposite in2="drop" operator="in" result="dropShadow"/>
      <feOffset in="b" dx="-3.74" dy="-6.05" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#A98A67" flood-opacity="0.55"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feOffset in="b" dx="2.89" dy="5.11" result="bh"/>
      <feComposite in="SourceAlpha" in2="bh" operator="arithmetic" k2="1" k3="-1" result="hm"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feComposite in2="hm" operator="in" result="hl"/>
      <feMerge result="lit">
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="hl"/>
      </feMerge>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="litClip"/>
      <feMerge>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="litClip"/>
      </feMerge>
    </filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="-0.47" dy="8.99" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#B8966F" flood-opacity="0.7"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
      </feMerge>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="prop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="bo"/>
      <feFlood flood-color="#6B5440" flood-opacity="0.18"/>
      <feComposite in2="bo" operator="in" result="drop"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#prop)">
