    <ellipse cx="92" cy="-20" rx="8" ry="13" transform="rotate(-26 92 -20)" fill="#1C9887"/>
    <path d="M-30,-22 C-30,-66 16,-66 16,-22" fill="none" stroke="#1C9887" stroke-width="10" stroke-linecap="round"/>
    <rect x="-42" y="-26" width="78" height="64" rx="20" fill="#2FC7B2"/>
    <rect x="-42" y="-26" width="78" height="16" rx="8" fill="#5FDCC9"/>
    <circle cx="-3" cy="12" r="9" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <ellipse cx="326" cy="268" rx="18" ry="15" transform="rotate(20 326 268)" fill="url(#fur)" filter="url(#limb)"/>
  <g filter="url(#prop)">
    <path d="M452,404 C452,380 454,366 454,340" fill="none" stroke="#3DAA5C" stroke-width="7" stroke-linecap="round"/>
    <path d="M453,386 C432,384 420,370 422,356 C438,356 452,368 453,386 Z" fill="#4CC36D"/>
    <path d="M454,374 C474,372 486,356 484,344 C468,344 454,356 454,374 Z" fill="#4CC36D"/>
    <g transform="translate(454 330)">
      <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#FF6FA8"/>
      <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#FF6FA8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#FF6FA8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#FF6FA8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#FF6FA8" transform="rotate(288)"/>
      <circle r="11" fill="#FFD23F"/>
