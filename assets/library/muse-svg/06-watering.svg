    </g>
    <ellipse cx="0" cy="-178" rx="60" ry="47" fill="url(#faceFill)" filter="url(#inset)"/>
    <ellipse cx="-31" cy="-166" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <ellipse cx="43" cy="-166" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <ellipse cx="-17" cy="-181" rx="6.4" ry="7.8" fill="#2B211D"/>
    <circle cx="-15" cy="-184" r="2.2" fill="#FFFFFF"/>
    <ellipse cx="29" cy="-181" rx="6.4" ry="7.8" fill="#2B211D"/>
    <circle cx="31" cy="-184" r="2.2" fill="#FFFFFF"/>
    <path d="M-1,-170 Q6,-163 13,-170" fill="none" stroke="#6A463A" stroke-width="3.2" stroke-linecap="round"/>
    
    
    
  </g>
  <g filter="url(#prop)" transform="translate(346 300) rotate(18)">
