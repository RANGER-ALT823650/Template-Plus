    <ellipse cx="88" cy="-96" rx="19" ry="17" transform="rotate(-20 88 -96)" fill="url(#fur)" filter="url(#limb)"/>
    
    
    <path d="M-66,-238 C-40,-278 30,-282 62,-246 C90,-214 120,-190 142,-150 L126,-138 C96,-176 70,-196 40,-212 C6,-230 -40,-226 -66,-238 Z" fill="#6C7BFF"/>
