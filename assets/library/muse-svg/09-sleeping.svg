    <g filter="url(#prop)">
      <path d="M-98,-124 C-106,-138 -92,-146 -60,-140 C-20,-134 20,-134 60,-140 C92,-146 106,-138 98,-124 C92,-100 92,-72 98,-48 C104,-34 90,-26 60,-32 C20,-38 -20,-38 -60,-32 C-90,-26 -104,-34 -98,-48 C-92,-72 -92,-100 -98,-124 Z" fill="#9FCBFF"/>
      <path d="M-78,-120 C-40,-114 40,-114 78,-120" fill="none" stroke="#CFE5FF" stroke-width="9" stroke-linecap="round"/>
      <circle cx="-40" cy="-84" r="7" fill="#FFFFFF"/>
