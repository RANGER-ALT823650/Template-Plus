    <ellipse cx="-37" cy="-162" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <ellipse cx="37" cy="-162" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <path d="M-31,-178 Q-23,-170 -15,-178" fill="none" stroke="#2B211D" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M15,-178 Q23,-170 31,-178" fill="none" stroke="#2B211D" stroke-width="3.6" stroke-linecap="round"/>
