<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>MUSE · 喝咖啡</title>
  <defs>
    <radialGradient id="fur" gradientUnits="userSpaceOnUse" cx="-40" cy="-210" r="330">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="0.5" stop-color="#EFE5D5"/>
      <stop offset="1" stop-color="#DCCAB1"/>
    </radialGradient>
    <radialGradient id="faceFill" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6E7D6"/>
    </radialGradient>
    <filter id="plush" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="b"/>
      <feOffset in="b" dx="-9" dy="-13" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#A98A67" flood-opacity="0.62"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="40" result="b2"/>
      <feOffset in="b2" dx="0" dy="-30" result="bs2"/>
      <feComposite in="SourceAlpha" in2="bs2" operator="arithmetic" k2="1" k3="-1" result="am"/>
      <feFlood flood-color="#B89C7A" flood-opacity="0.35"/>
      <feComposite in2="am" operator="in" result="ambient"/>
      <feOffset in="b" dx="7" dy="11" result="bh"/>
      <feComposite in="SourceAlpha" in2="bh" operator="arithmetic" k2="1" k3="-1" result="hm"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.75"/>
      <feComposite in2="hm" operator="in" result="hl"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="ambient"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="hl"/>
      </feMerge>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="limb" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="2" dy="7" result="drop"/>
      <feFlood flood-color="#9C7C5B" flood-opacity="0.38"/>
      <feComposite in2="drop" operator="in" result="dropShadow"/>
      <feOffset in="b" dx="-4.05" dy="-5.85" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#A98A67" flood-opacity="0.55"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feOffset in="b" dx="3.15" dy="4.95" result="bh"/>
      <feComposite in="SourceAlpha" in2="bh" operator="arithmetic" k2="1" k3="-1" result="hm"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.7"/>
      <feComposite in2="hm" operator="in" result="hl"/>
      <feMerge result="lit">
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="hl"/>
      </feMerge>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="litClip"/>
      <feMerge>
        <feMergeNode in="dropShadow"/>
        <feMergeNode in="litClip"/>
      </feMerge>
    </filter>
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="0" dy="9" result="bs"/>
      <feComposite in="SourceAlpha" in2="bs" operator="arithmetic" k2="1" k3="-1" result="sm"/>
      <feFlood flood-color="#B8966F" flood-opacity="0.7"/>
      <feComposite in2="sm" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="shadow"/>
      </feMerge>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="prop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="bo"/>
      <feFlood flood-color="#6B5440" flood-opacity="0.18"/>
      <feComposite in2="bo" operator="in" result="drop"/>
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(256 450) rotate(0) scale(1.28)">
    
    <g filter="url(#plush)">
      <path d="M-44,-18 L-46,-2" fill="none" stroke="url(#fur)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M44,-18 L46,-2" fill="none" stroke="url(#fur)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-86,-122 Q-104,-96 -84,-80" fill="none" stroke="url(#fur)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M86,-122 Q104,-96 84,-80" fill="none" stroke="url(#fur)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,-262 C63,-262 93,-214 97,-160 C101,-110 118,-72 116,-36 C114,-8 90,4 0,4 C-90,4 -114,-8 -116,-36 C-118,-72 -101,-110 -97,-160 C-93,-214 -63,-262 0,-262 Z" fill="url(#fur)"/>
    </g>
    <ellipse cx="0" cy="-178" rx="60" ry="47" fill="url(#faceFill)" filter="url(#inset)"/>
    <ellipse cx="-37" cy="-166" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <ellipse cx="37" cy="-166" rx="11" ry="6.5" fill="#F59C95" opacity="0.75" filter="url(#soft)"/>
    <path d="M-31,-177 Q-23,-188 -15,-177" fill="none" stroke="#2B211D" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M15,-177 Q23,-188 31,-177" fill="none" stroke="#2B211D" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M-9,-170 Q0,-156 9,-170 Z" fill="#9A4A45" stroke="#9A4A45" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="0" cy="-163" rx="4.5" ry="2.6" fill="#F58C8C"/>
    
    <g filter="url(#prop)">
      <path d="M44,-102 C74,-102 78,-58 46,-58" fill="none" stroke="#FF5E57" stroke-width="12" stroke-linecap="round"/>
      <path d="M-48,-118 H48 V-58 Q48,-26 16,-26 H-16 Q-48,-26 -48,-58 Z" fill="#FF6F61"/>
      <path d="M-48,-106 H48 V-94 H-48 Z" fill="#FF8C7F"/>
      <ellipse cx="0" cy="-118" rx="48" ry="12" fill="#E2453E"/>
      <ellipse cx="0" cy="-117" rx="41" ry="8.5" fill="#8A5433"/>
      <path d="M-8,-120 C-14,-126 -2,-128 0,-122 C2,-128 14,-126 8,-120 L0,-114 Z" fill="#F6DDBE"/>
      <path d="M-10,-74 C-20,-86 -4,-92 0,-82 C4,-92 20,-86 10,-74 L0,-64 Z" fill="#FFFFFF"/>
    </g>
    <ellipse cx="-50" cy="-70" rx="19" ry="16" transform="rotate(20 -50 -70)" fill="url(#fur)" filter="url(#limb)"/>
    <ellipse cx="50" cy="-80" rx="19" ry="16" transform="rotate(-20 50 -80)" fill="url(#fur)" filter="url(#limb)"/>
    
    
  </g>
</svg>
