<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#F7F7F2"><title>Template Plus · 形象编辑器</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23936439'/%3E%3Cpath d='M23 15l3 6M31 14l2 5' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/ui.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i></span><span>Template Plus</span></a><nav><a href="/" data-i18n="贴纸">贴纸</a></nav><div class="header-actions"><button class="text-button icon-control" id="show-agent" data-help="使用命令行继续编辑形象" data-i18n-aria="使用命令行继续编辑形象">&gt;_</button><button class="language-toggle" id="language-toggle" type="button">EN</button></div></header>
<main><div class="intro"><h1 data-i18n="形象编辑器">形象编辑器</h1><button id="show-gallery" class="collection-link" data-i18n="全部组合 ↗">全部组合 ↗</button></div>
<div class="workspace"><section class="preview-panel" data-i18n-aria="形象预览"><div class="panel-top"><span data-i18n="预览">预览</span><div class="preview-toggles" data-i18n-aria="预览底色"><button id="preview-light" class="active" data-help="浅色预览" data-i18n-aria="浅色预览" aria-pressed="true">◐</button><button id="preview-grid" data-help="棋盘格预览" data-i18n-aria="棋盘格预览" aria-pressed="false">▦</button></div></div><div class="stage" id="stage"><div id="avatar" class="avatar"></div></div><div class="preview-bottom"><div><strong id="character-name"></strong><span id="character-meta"></span></div><button id="random" class="shuffle-button" data-help="随机组合" data-i18n-aria="随机组合">⤨</button></div><div class="mini-friends" id="friends" data-i18n-aria="其他组合推荐"></div></section>
<section class="controls" data-i18n-aria="形象编辑器"><div class="control-section"><div class="section-title"><h2 data-i18n="图案">图案</h2><span class="value" id="shape-name"></span></div><div id="shapes" class="shape-grid" role="group" data-i18n-aria="图案"></div></div><div class="control-section"><div class="section-title"><h2 data-i18n="颜色">颜色</h2><span class="value color-value" id="color-value"></span></div><div id="colors" class="color-grid" role="group" data-i18n-aria="颜色"></div></div><div class="control-section export-section"><div class="section-title"><h2 data-i18n="导出">导出</h2><button class="help" type="button" data-help="纯色轮廓与固定白色眼睛。SVG 可无限缩放，PNG 与 WebP 按所选像素尺寸导出。" data-i18n-aria="导出说明">ⓘ</button></div><div class="export-settings"><label><span data-i18n="尺寸">尺寸</span><select id="size"><option value="256">256 × 256</option><option value="512">512 × 512</option><option value="1024" selected>1024 × 1024</option><option value="2048">2048 × 2048</option><option value="4096">4096 × 4096</option></select></label><label><span data-i18n="背景">背景</span><select id="background"><option value="transparent" data-i18n="透明">透明</option><option value="white" data-i18n="白色">白色</option></select></label></div><label class="padding-label" for="padding"><span data-i18n="留白">留白</span><output id="padding-value">16%</output></label><input type="range" id="padding" min="0" max="40" step="1" value="16"><div class="download-row"><button id="export-svg" class="primary-button">↓ SVG</button><button id="export-png" class="secondary-button">↓ PNG</button><button id="export-webp" class="icon-button">↓ WebP</button></div><button id="send-to-layout" class="secondary-button full" data-i18n="＋ 添加到贴纸">＋ 添加到贴纸</button></div><div class="recipe-actions"><button id="save-config" data-i18n="↓ 保存">↓ 保存</button><button id="load-config" data-i18n="↑ 打开">↑ 打开</button><button id="reset" data-i18n="重置">重置</button><input type="file" id="config-file" accept="application/json,.json" hidden></div></section></div>
</main>
<dialog id="agent-dialog"><div class="dialog-heading"><h2 data-i18n="命令行">命令行</h2><button class="close-dialog" data-i18n-aria="关闭">×</button></div><p data-i18n="在 Template-Plus 目录运行命令，导出当前形象。">在 Template-Plus 目录运行命令，导出当前形象。</p><pre id="cli-command"></pre><button id="copy-command" class="primary-button" data-i18n="复制命令">复制命令</button><details class="agent-more"><summary data-i18n="更多命令">更多命令</summary><p><code>node cli.mjs list --json</code></p><p><code>node cli.mjs batch --out output/all --formats svg,png</code></p><p><code>node cli.mjs render --config avatar.json --out output/avatar.png</code></p></details></dialog>
<dialog id="gallery-dialog"><div class="dialog-heading"><h2 data-i18n="全部组合">全部组合</h2><button class="close-dialog" data-i18n-aria="关闭">×</button></div><p data-i18n="点击形象继续编辑。">点击形象继续编辑。</p><div class="gallery-grid" id="gallery"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
